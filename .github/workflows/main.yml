name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: [22, 24]

    name: Using Node ${{ matrix.node }} environment

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: "npm"
          node-version: ${{ matrix.node }}
      - run: npm i
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:e2e -- --headless
